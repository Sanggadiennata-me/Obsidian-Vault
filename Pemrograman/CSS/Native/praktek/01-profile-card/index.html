<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktek 01: Profile Card Modern</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="card-header">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Foto Profil" class="avatar">
    </div>
    <div class="card-body">
      <h2 class="name">Aryanda S.</h2>
      <p class="role">Frontend Developer & Security Enthusiast</p>
      <p class="bio">Fokus membangun antarmuka web modern dengan CSS Native yang bersih, terstruktur, dan responsif.</p>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-num">42</span>
          <span class="stat-label">Proyek</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">1.2k</span>
          <span class="stat-label">Pengikut</span>
        </div>
        <div class="stat-item">
          <span class="stat-num">98%</span>
          <span class="stat-label">Kepuasan</span>
        </div>
      </div>
      <button class="btn-follow">Ikuti Profil</button>
    </div>
  </div>
</body>
</html>
