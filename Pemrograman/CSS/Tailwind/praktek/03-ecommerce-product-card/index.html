<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktek 03: Interactive E-Commerce Product Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-6 font-sans">
  <div class="group relative w-full max-w-sm bg-white rounded-3xl p-4 border border-slate-200/80 shadow-md hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1">
    <!-- Image Box with Badge -->
    <div class="relative w-full h-64 bg-slate-100 rounded-2xl overflow-hidden mb-4">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" 
           alt="Sepatu Sneaker Merah" 
           class="w-full h-full object-cover object-center group-hover:scale-110 transition-transform duration-500 ease-out">
      
      <!-- Discount Badge dengan Animasi Pulse -->
      <div class="absolute top-3 left-3 bg-rose-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg shadow-rose-600/30 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
        <span>DISKON 35%</span>
      </div>

      <!-- Wishlist Button -->
      <button class="absolute top-3 right-3 w-9 h-9 bg-white/90 backdrop-blur-md rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 hover:scale-110 transition shadow-sm">
        ❤
      </button>
    </div>

    <!-- Product Info -->
    <div class="px-2">
      <div class="flex items-center justify-between text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">
        <span>Sepatu Lari Pria</span>
        <span class="text-amber-500 flex items-center gap-1">★ 4.9 <span class="text-slate-400">(128)</span></span>
      </div>

      <h2 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors">
        Air Pegasus Speed Runner
      </h2>
      <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed">
        Bantalan responsif ultra-ringan dengan sirkulasi udara optimal untuk performa lari jarak jauh.
      </p>

      <!-- Color Selector using CSS :has() Variant -->
      <div class="mt-4 pt-3 border-t border-slate-100">
        <span class="text-xs font-semibold text-slate-700 block mb-2">Pilihan Warna:</span>
        <div class="flex items-center gap-2.5">
          <!-- Opsi 1 (Merah - Checked) -->
          <label class="cursor-pointer relative flex items-center justify-center p-0.5 rounded-full ring-offset-2 has-[:checked]:ring-2 has-[:checked]:ring-rose-500">
            <input type="radio" name="color" value="red" checked class="sr-only">
            <span class="w-6 h-6 rounded-full bg-rose-600 block shadow-inner"></span>
          </label>
          <!-- Opsi 2 (Biru) -->
          <label class="cursor-pointer relative flex items-center justify-center p-0.5 rounded-full ring-offset-2 has-[:checked]:ring-2 has-[:checked]:ring-blue-600">
            <input type="radio" name="color" value="blue" class="sr-only">
            <span class="w-6 h-6 rounded-full bg-blue-600 block shadow-inner"></span>
          </label>
          <!-- Opsi 3 (Hitam) -->
          <label class="cursor-pointer relative flex items-center justify-center p-0.5 rounded-full ring-offset-2 has-[:checked]:ring-2 has-[:checked]:ring-slate-900">
            <input type="radio" name="color" value="black" class="sr-only">
            <span class="w-6 h-6 rounded-full bg-slate-900 block shadow-inner"></span>
          </label>
        </div>
      </div>

      <!-- Price & CTA -->
      <div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-100">
        <div>
          <span class="text-xs text-slate-400 line-through block">Rp 1.899.000</span>
          <span class="text-xl font-extrabold text-slate-900">Rp 1.234.000</span>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-blue-600/25 transition-all">
          + Keranjang
        </button>
      </div>
    </div>
  </div>
</body>
</html>
