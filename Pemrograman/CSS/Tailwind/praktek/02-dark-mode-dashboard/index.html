<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktek 02: Dark Mode & Dashboard Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen transition-colors duration-200 p-6 md:p-10">
  <div class="max-w-6xl mx-auto space-y-8">
    <!-- Top Bar with Dark Mode Switcher -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Admin Dashboard</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Implementasi varian dark mode Tailwind CSS dengan state class.</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="toggleBtn" onclick="document.documentElement.classList.toggle('dark')" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl border border-slate-200 dark:border-slate-700 transition">
          <span class="dark:hidden">☀️ Mode Terang Aktif</span>
          <span class="hidden dark:inline">🌙 Mode Gelap Aktif</span>
        </button>
        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
          Buat Laporan
        </button>
      </div>
    </header>

    <!-- Stat Cards Grid (Flexbox & Grid Responsif) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <!-- Card 1 -->
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider">Total Pendapatan</span>
          <span class="p-2 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-lg text-sm">💰</span>
        </div>
        <div class="text-2xl font-extrabold text-slate-900 dark:text-white">Rp 84.5M</div>
        <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-emerald-600 dark:text-emerald-400">
          <span>↑ 18.2%</span>
          <span class="text-slate-400 dark:text-slate-500">dibanding bulan lalu</span>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider">Pengguna Baru</span>
          <span class="p-2 bg-purple-50 dark:bg-purple-950 text-purple-600 dark:text-purple-400 rounded-lg text-sm">👥</span>
        </div>
        <div class="text-2xl font-extrabold text-slate-900 dark:text-white">+3,420</div>
        <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-emerald-600 dark:text-emerald-400">
          <span>↑ 6.4%</span>
          <span class="text-slate-400 dark:text-slate-500">pertumbuhan mingguan</span>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider">Tingkat Konversi</span>
          <span class="p-2 bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 rounded-lg text-sm">📈</span>
        </div>
        <div class="text-2xl font-extrabold text-slate-900 dark:text-white">4.85%</div>
        <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-rose-600 dark:text-rose-400">
          <span>↓ 0.8%</span>
          <span class="text-slate-400 dark:text-slate-500">perlu optimasi funnel</span>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition">
        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider">Beban Server</span>
          <span class="p-2 bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 rounded-lg text-sm">⚡</span>
        </div>
        <div class="text-2xl font-extrabold text-slate-900 dark:text-white">28%</div>
        <div class="flex items-center gap-1.5 mt-2 text-xs font-medium text-emerald-600 dark:text-emerald-400">
          <span>Normal</span>
          <span class="text-slate-400 dark:text-slate-500">kapasitas sangat aman</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
